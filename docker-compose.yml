services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yomeets_postgres
    environment:
      POSTGRES_DB: yomeets
      POSTGRES_PASSWORD: yomeets_dev_password
      POSTGRES_USER: yomeets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomeets -d yomeets"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"
    volumes:
      - yomeets_postgres_data:/var/lib/postgresql/data

volumes:
  yomeets_postgres_data:
